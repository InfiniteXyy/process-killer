name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked

      - name: Bundle as .app
        run: |
          APP="ProcessKiller.app"
          mkdir -p "$APP/Contents/"{MacOS,Resources}
          cp target/release/process-killer "$APP/Contents/MacOS/"
          cp Info.plist "$APP/Contents/"
          cp public/assets/icons/process-killer.icns "$APP/Contents/Resources/"
          # 临时签名避免"已损坏"提示
          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          hdiutil create -volname "ProcessKiller" -srcfolder ProcessKiller.app \
            -ov -format UDZO ProcessKiller.dmg

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ProcessKiller.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/process-killer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
