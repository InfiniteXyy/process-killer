name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Bundle as .app
        run: |
          mkdir -p ProcessKiller.app/Contents/{MacOS,Resources}
          cp target/release/process-killer ProcessKiller.app/Contents/MacOS/
          cp Info.plist ProcessKiller.app/Contents/
          cp public/assets/icons/process-killer.icns ProcessKiller.app/Contents/Resources/
          echo "App bundle created: ProcessKiller.app"
      - name: Create archive
        run: zip -r ProcessKiller.app.zip ProcessKiller.app
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProcessKiller.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/process-killer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
