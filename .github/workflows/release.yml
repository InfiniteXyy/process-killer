name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Bundle as .app
        run: |
          APP_DIR="ProcessKiller.app/Contents/MacOS"
          mkdir -p "$APP_DIR"
          cp target/release/process-killer "$APP_DIR/"
          cp Info.plist ProcessKiller.app/Contents/
          echo "App bundle created: ProcessKiller.app"
      - name: Create archive
        run: zip -r ProcessKiller.app.zip ProcessKiller.app
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ProcessKiller.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/process-killer.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
